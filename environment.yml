# src/ and tests/ don't need PDAL; it's here so the notebooks can execute pipelines.
name: veg
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - python-pdal
  - geopandas
  - pyproj
  - shapely
  - rioxarray
  - requests
  - matplotlib
  - ipyleaflet
  - ipywidgets
  - ipykernel
  - jupyterlab
  - pytest
  - pip
  - pip:
      - -e .  # this repo's veg_a package
